# Мониторинг: Prometheus, Grafana, метрики сервера и видеокарт.
#
#   docker compose -f infra/compose/compose.yaml -f infra/compose/compose.gpu.yaml \
#     -f infra/compose/compose.monitoring.yaml --profile gpu up -d
#
# Grafana слушает только 127.0.0.1:3000 — открывайте через VPN или SSH-туннель.

services:
  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.16.0}
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus:/prometheus
    networks: [backend]

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:13.2.6}
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?нет GRAFANA_ADMIN_PASSWORD (infra/scripts/gen-secrets.sh)}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    networks: [backend]

  node-exporter:
    image: ${NODE_EXPORTER_IMAGE:-prom/node-exporter:v1.12.1}
    restart: unless-stopped
    command: ["--path.rootfs=/host"]
    pid: host
    volumes:
      - /:/host:ro,rslave
    networks: [backend]

  # видеокарты: загрузка, память, температура (профиль gpu).
  # Актуальная версия образа — на catalog.ngc.nvidia.com (nvidia/k8s/dcgm-exporter).
  dcgm-exporter:
    profiles: [gpu]
    image: ${DCGM_EXPORTER_IMAGE:-nvcr.io/nvidia/k8s/dcgm-exporter:4.2.3-4.1.1-ubuntu22.04}
    restart: unless-stopped
    cap_add: [SYS_ADMIN]
    networks: [backend]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  prometheus: {}
  grafana: {}
