global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # API: запросы и задержки по шаблонам маршрутов (без IP и параметров)
  - job_name: api
    static_configs:
      - targets: ["api:8000"]

  # vLLM: очередь, задержка первого токена, загрузка KV-кэша
  - job_name: vllm
    static_configs:
      - targets: ["vllm-llm:8000"]
        labels: { model: llm }
      - targets: ["vllm-embed:8000"]
        labels: { model: embeddings }
      - targets: ["vllm-rerank:8000"]
        labels: { model: reranker }

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: gpu
    static_configs:
      - targets: ["dcgm-exporter:9400"]
