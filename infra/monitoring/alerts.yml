groups:
  - name: doomich
    rules:
      - alert: ApiDown
        expr: up{job="api"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "API «Думыча» не отвечает"

      - alert: ApiErrors
        expr: |
          sum(rate(doomich_http_requests_total{status=~"5.."}[5m]))
            / clamp_min(sum(rate(doomich_http_requests_total[5m])), 1e-9) > 0.05
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Больше 5% ответов API — ошибки сервера"

      - alert: ApiSlow
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(doomich_http_request_seconds_bucket{route!~"/v1/chats/.*/messages|/v1/chat/incognito|/v1/voice"}[5m]))) > 2
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "95% запросов API (кроме ответов чата) дольше 2 секунд"

      - alert: LlmDown
        expr: up{job="vllm", model="llm"} == 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Языковая модель недоступна — чат не отвечает"

      - alert: LlmQueue
        expr: sum(vllm:num_requests_waiting{model="llm"}) > 20
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Очередь к языковой модели больше 20 запросов"

      - alert: GpuMemoryHigh
        expr: DCGM_FI_DEV_FB_USED / (DCGM_FI_DEV_FB_USED + DCGM_FI_DEV_FB_FREE) > 0.97
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Видеопамять GPU {{ $labels.gpu }} почти закончилась"

      - alert: DiskAlmostFull
        expr: node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} < 0.1
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "На диске сервера меньше 10% свободного места"
