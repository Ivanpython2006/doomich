- name: Системные пакеты
  ansible.builtin.apt:
    name: [ca-certificates, curl, gnupg, git, ufw, unattended-upgrades, chrony]
    state: present
    update_cache: true

- name: Репозиторий Docker
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: https://download.docker.com/linux/ubuntu
    suites: ["{{ ansible_distribution_release }}"]
    components: [stable]
    architectures: ["{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"]
    signed_by: https://download.docker.com/linux/ubuntu/gpg

- name: Docker Engine и Compose
  ansible.builtin.apt:
    name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
    state: present
    update_cache: true

- name: Журналы контейнеров с ограничением размера
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: |
      {"log-driver": "json-file", "log-opts": {"max-size": "50m", "max-file": "5"}, "live-restore": true}
    mode: "0644"
  notify: Перезапустить Docker

- name: SSH только из сети администраторов
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    src: "{{ item }}"
  loop: "{{ doomich_ssh_networks }}"

- name: HTTP и HTTPS
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: ["80", "443"]

- name: Включить межсетевой экран (по умолчанию входящие запрещены)
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming

- name: Автоматические обновления безопасности
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    mode: "0644"
