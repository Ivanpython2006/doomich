# Драйвер NVIDIA (серверная ветка) и nvidia-container-toolkit, чтобы контейнеры видели GPU.
- name: Инструмент выбора драйверов
  ansible.builtin.apt:
    name: [ubuntu-drivers-common]
    state: present
    update_cache: true

- name: Драйвер NVIDIA (рекомендованный для карты)
  ansible.builtin.command: ubuntu-drivers install --gpgpu
  register: nvidia_driver
  changed_when: "'already installed' not in nvidia_driver.stdout"
  notify: Перезагрузить сервер

- name: Репозиторий NVIDIA Container Toolkit
  ansible.builtin.deb822_repository:
    name: nvidia-container-toolkit
    types: [deb]
    uris: https://nvidia.github.io/libnvidia-container/stable/deb/$(ARCH)
    suites: ["/"]
    signed_by: https://nvidia.github.io/libnvidia-container/gpgkey

- name: NVIDIA Container Toolkit
  ansible.builtin.apt:
    name: nvidia-container-toolkit
    state: present
    update_cache: true

- name: Подключить GPU-рантайм к Docker
  ansible.builtin.command: nvidia-ctk runtime configure --runtime=docker
  register: nvidia_ctk
  changed_when: "'updated' in nvidia_ctk.stdout or 'Wrote' in nvidia_ctk.stdout"
  notify: Перезапустить Docker
