# Скопируйте в inventory.ini (не попадает в git) и укажите свои серверы.
# Конфигурация А: один сервер с GPU. Конфигурация Б: прикладной узел и GPU-узел отдельно —
# тогда в группе gpu второй сервер, а в group_vars задайте адреса vLLM для API.
[app]
doomich-1 ansible_host=10.20.0.10 ansible_user=admin

[gpu]
doomich-1

[doomich:children]
app
gpu
