# Общие правила для HTTP (разработка) и HTTPS (боевой режим).

# конспекты лекций — до 500 МБ (DOOMICH_MAX_LECTURE_MB)
client_max_body_size 520m;
client_body_timeout 300s;

proxy_http_version 1.1;
include /etc/nginx/doomich/proxy-headers.conf;
# keepalive до API
proxy_set_header Connection "";

add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;

# API приложений. Ответы чата идут потоком (SSE) — без буферизации.
location /v1/ {
    proxy_pass http://doomich_api;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
}

# голосовой канал (WebSocket)
location = /v1/voice {
    proxy_pass http://doomich_api;
    include /etc/nginx/doomich/proxy-headers.conf;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# страница приглашения — для QR, отсканированного обычной камерой
location /invite/ {
    proxy_pass http://doomich_api;
}

location = /healthz {
    access_log off;
    proxy_pass http://doomich_api;
}

# панель администратора и админ-API — только из VPN и внутренней сети вуза
location /admin/v1/ {
    include /etc/nginx/doomich/admin-allow.conf;
    client_max_body_size 60m;
    proxy_pass http://doomich_api;
    proxy_read_timeout 300s;
}

location = /admin {
    return 301 /admin/;
}

location /admin/ {
    include /etc/nginx/doomich/admin-allow.conf;
    root /usr/share/nginx;
    try_files $uri $uri/ /admin/index.html;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    # Ant Design задаёт стили в разметке, поэтому style-src 'unsafe-inline'
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location /admin/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }
}

# метрики и документация API наружу не отдаются (Prometheus ходит к API напрямую во внутренней сети)
location /metrics { return 404; }
location /docs { return 404; }
location /openapi.json { return 404; }

location / {
    return 404;
}
