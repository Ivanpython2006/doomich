# Заголовки для API. В location, где задаётся свой proxy_set_header, этот файл нужно подключить
# заново: nginx не наследует proxy_set_header, если на уровне location задан хотя бы один.
proxy_set_header Host $host;
# по X-Real-IP сервер считает лимиты запросов; IP нигде не сохраняется
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
