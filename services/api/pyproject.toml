[project]
name = "doomich-api"
version = "0.1.0"
description = "Core API «Думыча»: аккаунты без ПД, чат с ИИ, голос, расписание, документы (RAG), админка"
requires-python = ">=3.12"
dependencies = [
    "doomich-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "cryptography>=43",
    "pyotp>=2.9",
    "httpx>=0.28",
    "python-multipart>=0.0.17",
    "celery[redis]>=5.4",
    "redis>=5.2",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "pypdf>=5.1",
    "icalendar>=6.1",
    "recurring-ical-events>=3.3",
    "selectolax>=0.3.26",
    "prometheus-client>=0.21",
    "typer>=0.13",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Высококачественный разбор PDF/сканов. Тяжёлый (PyTorch), поэтому опционально.
docling = ["docling>=2.10"]

[project.scripts]
doomich-api = "doomich_api.cli:app"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doomich_api"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8"]
