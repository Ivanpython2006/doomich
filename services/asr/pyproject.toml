[project]
name = "doomich-asr"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["doomich-common", "fastapi>=0.115", "uvicorn[standard]>=0.32", "pydantic-settings>=2.6", "python-multipart>=0.0.17", "numpy>=1.26"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doomich_asr"]
