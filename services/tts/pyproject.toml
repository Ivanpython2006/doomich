[project]
name = "doomich-tts"
version = "0.1.0"
description = "Сервис синтеза речи «Думыча»: sherpa-onnx (VITS/Kokoro/Matcha) и OpenAI-совместимые серверы, нормализация текста"
requires-python = ">=3.12"
dependencies = [
    "doomich-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "numpy>=1.26",
    "httpx>=0.28",
]

[project.optional-dependencies]
sherpa = ["sherpa-onnx>=1.10"]

[project.scripts]
doomich-tts = "doomich_tts.main:run"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doomich_tts"]
